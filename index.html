function intro(){const T=[['Beginner','Any loss'],['Capable investor','Up to 20 lakh'],['Sharp investor','20 to 50 lakh'],['Exceptional','50 lakh to 1 crore'],['Market master','Over 1 crore']];
return `<div class="hero"><div class="hbg"></div><div class="hin"><p class="sub">Global Space × Vision Next</p><h1>Flip House</h1><p>Buy a neglected Karachi property, fix what matters and sell it for a profit. Three deals, starting with PKR 1.5 crore.</p><button class="go" onclick="S.ph='market';draw()">Start playing</button></div></div>
<div class="card"><h2>How it works</h2><div class="grid">${[['1. Find','Choose from three listings. Distressed sales are cheap but risky.'],['2. Inspect','Pay to see hidden faults before you buy, or gamble and skip it.'],['3. Renovate','Fix what buyers care about and ignore what they do not. Match your upgrades to your target buyer.'],['4. Sell','Wait for a better offer if you dare. Holding costs and tax keep running.']].map(a=>`<div><h3>${a[0]}</h3><small>${a[1]}</small></div>`).join('')}</div></div>
<div class="card"><h2>Know before you play</h2><div class="row"><span>Faults</span><small>Cosmetic, major or critical. A critical fault can kill a sale.</small></div><div class="row"><span>Costs</span><small>Stamp duty, selling costs, holding costs and tax at sale.</small></div><div class="row"><span>Surprises</span><small>Contractor overruns, permit delays and market swings.</small></div><h3>Ranks after three deals</h3>${T.map(t=>`<div class="row"><span>${t[0]}</span><small>${t[1]}</small></div>`).join('')}<button class="go" onclick="S.ph='market';draw()">Start playing</button></div>`}
function market(){if(S.cash<6.2e6*1.03)return end();
return `<div class="card"><h2>Find a property</h2><p class="sub">Three listings today from Global Space. Game taxes are simplified: 3% stamp duty and registration on purchase; at sale, the higher of 15% capital gains tax or 2% advance tax.</p><div class="grid">${S.list.map((h,i)=>`<button ${S.cash<h.price*1.03?'disabled':''} onclick="pick(${i})"><div class="th">${art(h.k,0,0)}</div><b>${h.n}</b>${h.dd?' <span class="tag s2">Distressed sale</span>':''}<br>${h.a}, ${h.s}<br>Asking ${fmt(h.price)}<br><small>Likely resale about ${fmt(h.r)}</small></button>`).join('')}</div></div>`}
function pick(i){S.h=S.list[i];S.ph='inspect';draw()}
function inspect(){const h=S.h,fe=fee(h);return `<div class="card"><h2>${h.n}</h2><p class="sub">${h.a}, ${h.s}. Asking ${fmt(h.price)}</p>${S.known?`<h3>Inspection report</h3>${h.f.map(f=>`<div class="row"><span><span class="tag s${f.s}">${SEV[f.s]}</span>${f.n}</span><b>${fmt(f.c)}</b></div>`).join('')}<button class="go" onclick="S.ph='offer';draw()">Make an offer</button>`:`<p>This property has ${h.f.length>3?'a worrying number of':'some'} problems you cannot see. A full inspection costs ${fmt(fe)} and lists every fault with its repair cost. Skip it and you find out the hard way.</p><button class="go" onclick="insp()">Hire an inspector (${fmt(fe)})</button><button class="go alt" onclick="S.ph='offer';draw()">Skip the inspection</button>`}<button style="margin-top:10px" onclick="walk()">Walk away${S.known?'':''}</button></div>`}
function insp(){S.cash-=fee(S.h);S.known=1;S.insp=fee(S.h);draw()}
function walk(){S.ph='market';newList();draw()}
function offer(){const h=S.h,o=[[1,1],[.93,.6],[.88,.35],[.82,.15]];return `<div class="card"><h2>Make your offer</h2><p class="sub">${h.n}. Asking ${fmt(h.price)}</p>${S.msg?`<div class="alert">${S.msg}</div>`:''}<div class="grid">${o.filter(x=>!S.rej||x[0]==1).map(x=>`<button ${S.cash<h.price*x[0]*1.03?'disabled':''} onclick="bid(${x[0]},${x[1]})"><b>${x[0]==1?'Pay asking':'Offer '+Math.round(x[0]*100)+'%'}</b><br>${fmt(Math.round(h.price*x[0]/1e4)*1e4)}<br><small>${x[0]==1?'Seller accepts':Math.round(x[1]*100)+'% chance seller accepts'}</small></button>`).join('')}</div><button style="margin-top:10px" onclick="walk()">Walk away</button></div>`}
function bid(p,c){if(p<1&&Math.random()>=c){S.rej=1;S.msg='Seller refused. The asking price stands.';return draw()}
S.paid=Math.round(S.h.price*p/1e4)*1e4;S.cash-=S.paid*TX;S.msg='';S.ph='reno';draw()}
function reno(){const h=S.h,av=S.cash-fixSum()-exSum();return `<div class="card"><h2>Plan the work</h2><p class="sub">Bought ${h.n} for ${fmt(S.paid)}. Choose a target buyer, then what to fix.</p>
<h3>Target buyer</h3><div class="grid">${Object.entries(B).map(([k,b])=>`<button class="${S.buyer==k?'sel':''}" onclick="S.buyer='${k}';draw()"><b>${b.n}</b><br><small>${b.d}</small></button>`).join('')}</div>
<h3>Repairs</h3>${S.known?h.f.map((f,i)=>`<div class="row"><span><span class="tag s${f.s}">${SEV[f.s]}</span>${f.n}<br><small>${FX[f.s]} if left</small></span><button class="${S.fix[i]?'sel':''}" ${!S.fix[i]&&f.c>av?'disabled':''} onclick="S.fix[${i}]=${S.fix[i]?0:1};draw()">${S.fix[i]?'Fixing ':'Fix '}${fmt(f.c)}</button></div>`).join(''):'<p class="sub">You skipped the inspection, so you are building blind. Contractors may open a wall and find problems, and the buyer’s surveyor will find the rest.</p>'}
${R.map(r=>`<h3>${r.n}</h3><div class="lv">${LV.map((n,l)=>{const d=L(r.c[l])-L(r.c[S.lv[r.id]]);return `<button class="${S.lv[r.id]==l?'sel':''}" ${d>av?'disabled':''} onclick="S.lv.${r.id}=${l};draw()">${n}<br>${l?fmt(L(r.c[l])):'-'}</button>`}).join('')}</div><small>${S.lv[r.id]?r.d[S.lv[r.id]-1]:'Left as it is'}</small>`).join('')}
<h3>Extras</h3><div class="grid">${X.map(x=>`<button class="${S.ex[x.id]?'sel':''}" ${!S.ex[x.id]&&x.c>av?'disabled':''} onclick="S.ex.${x.id}=${S.ex[x.id]?0:1};draw()"><b>${x.n}</b> ${fmt(x.c)}<br><small>${x.d}</small></button>`).join('')}</div>
<div style="margin-top:12px"><div class="row"><span>Finishes</span><b>${fmt(tot())}</b></div><div class="row"><span>Repairs</span><b>${fmt(fixSum())}</b></div><div class="row"><span>Extras</span><b>${fmt(exSum())}</b></div><div class="row"><span>Estimated time</span><b>${months()} months</b></div><div class="row"><span>Estimated value after finishes</span><b>${fmt(val())}</b></div></div><button class="go" onclick="finish()">Start work</button></div>`}
function finish(){let fc=0;const h=S.h;
if(S.known)h.f.forEach((f,i)=>{if(S.fix[i]){fc+=f.c;f.done=1}});
else h.f.forEach(f=>{if(f.s>=2&&Math.random()<.75){const c=Math.round(f.c*1.7);fc+=c;f.done=1;S.surpr.push(f.n+' ('+fmt(c)+')')}});
S.ov=Math.random()<.35?Math.round((tot()+exSum()+fc)*(.12+Math.random()*.15)):0;S.delay=Math.random()<.25?2:0;
S.fixCost=fc;S.cash-=tot()+exSum()+fc+S.ov;S.ph='sell';newOffer();draw()}
function newOffer(){S.ev=S.ev&&S.relist?S.ev:EV[Math.floor(Math.random()*EV.length)];S.relist=0;S.off=Math.round(val()*(1+S.ev.d+(Math.random()-.5)*.04)/1e4)*1e4}
function sell(){const hold=months()*HOLD,notes=[];
if(S.surpr.length)notes.push('Contractors opened the walls and found: '+S.surpr.join(', ')+'. Emergency repairs cost 70% extra.');
if(S.ov)notes.push('The contractor ran over budget by '+fmt(S.ov)+'.');if(S.delay)notes.push('Permit delays added 2 months.');
return `<div class="card"><h2>Work complete</h2>${S.msg?`<div class="alert">${S.msg}</div>`:''}${notes.map(n=>`<div class="alert">${n}</div>`).join('')}<div class="row"><span>Market</span><b>${S.ev.n}</b></div><div class="row"><span>Offer on the table</span><b>${fmt(S.off)}</b></div><div class="row"><span>Holding cost so far (${months()} months)</span><b class="neg">${fmt(hold)}</b></div><p class="sub" style="margin-top:8px">The buyer’s surveyor inspects before the sale closes.</p><button class="go" onclick="accept()">Accept offer</button><button class="go alt" ${S.waits>=2?'disabled':''} onclick="S.waits++;S.msg='';S.ev=null;newOffer();draw()">Wait a month for a better offer (${2-S.waits} left)</button></div>`}
function accept(){const h=S.h,un=h.f.filter(f=>!f.done),cr=un.filter(f=>f.s==3);
if(cr.length&&S.walks<2&&Math.random()<.75){S.walks++;S.walked=1;S.msg='The buyer’s surveyor found '+cr[0].n.toLowerCase()+'. The buyer walked away. You relist two months later at a lower price.';S.ev={n:'Relisted after a failed sale',d:-.1};S.relist=1;newOffer();return draw()}
const disc=Math.round(un.reduce((s,f)=>s+f.c*PEN[f.s],0)),hold=months()*HOLD,fees=(S.off-disc)*.03,buy=S.paid*TX,sp=tot()+exSum()+S.fixCost+S.ov,gain=S.off-disc-buy-sp,tax=Math.round(Math.max(gain*.15,(S.off-disc)*.02));
S.disc=disc;S.tax=tax;S.gain=gain;S.net=S.off-disc-fees-buy-sp-hold-S.insp-tax;
S.rows=[['Sale price',S.off],['Buyer survey discount',-disc],['Selling costs (3%)',-fees],['Purchase and stamp duty',-buy],['Finishes',-tot()],['Extras',-exSum()],['Repairs',-S.fixCost],['Contractor overrun',-S.ov],['Holding costs',-hold],['Inspection',-S.insp],['Tax at sale',-tax]].filter(r=>r[1]!=0);
S.last={k:S.h.k,l:Math.max(lvAvg(),1),e:S.lv.ext};S.cash+=S.off-disc-fees-hold-tax;S.total+=S.net;S.sold=1;S.ph='result';draw()}
function lessons(){const l=[],h=S.h,un=h.f.filter(f=>!f.done);
if(!S.insp&&S.surpr.length)l.push('Skipping the inspection saved a few lakh but cost more in emergency repairs. An inspection pays for itself on risky properties.');
if(S.walked)l.push('A critical fault made a buyer walk away. Never list a property with unresolved structural or legal problems.');
if(S.disc&&!un.some(f=>f.s>=2))l.push('Leaving cosmetic faults cost very little. Fixing every small defect rarely pays.');
else if(S.disc)l.push('Unfixed major faults came off your sale price at more than the repair would have cost.');
if(tot()>S.paid*.3)l.push('You spent over 30% of the purchase price on finishes. Overspending takes value away.');
if(S.gain<=0&&S.tax)l.push('Even with no gain you paid '+fmt(S.tax)+' in advance tax at sale. Losses do not cancel the tax bill.');else if(S.tax>L(5))l.push('Tax took '+fmt(S.tax)+' of your gain. Always plan your margin after tax.');
if(S.ov)l.push('Contractors overrun. Keep at least a 15% buffer.');
if(S.waits>=2)l.push('Waiting two months cost '+fmt(2*HOLD)+' in holding costs. A better offer has to beat that.');
if(S.net>0&&!l.length)l.push('You matched the finishes to your buyer and kept costs in check. That is the Global Space approach.');
if(S.net<0&&!l.length)l.push('Check the buyer type against where you spent. Spend where your buyer pays.');return l.slice(0,3)}
function result(){const p=S.net>=0,m=S.net/(S.paid*TX+tot()),a=S.last;
return `<div class="card"><h2>${m>.12?'A strong flip':p?'A small win':'A costly lesson'}</h2><p class="sub">${S.h.n}. Drag the slider to compare.</p><div class="cmp"><div>${art(a.k,0,0,0)}</div><div class="af">${art(a.k,a.l,a.e,1)}</div></div><input class="rg" type="range" min="0" max="100" value="50" aria-label="Before and after" oninput="document.querySelector('.af').style.clipPath='inset(0 0 0 '+this.value+'%)'"><div class="row"><small>After</small><small>Before</small></div>${S.rows.map(r=>`<div class="row"><span>${r[0]}</span><b class="${r[1]<0?'neg':''}">${fmt(r[1])}</b></div>`).join('')}<div class="row"><b>Net profit</b><b class="cu ${p?'pos':'neg'}" data-n="${S.net}">${fmt(S.net)}</b></div><h3>What Global Space would tell you</h3>${lessons().map(t=>`<div class="tip">${t}</div>`).join('')}<button class="go" onclick="next()">${S.deal>=3?'See final score':'Next deal'}</button></div>`}
function next(){S.deal++;S.ev=null;S.ph=S.deal>3?'end':'market';newList();draw()}
function end(){S.ph='end';const t=S.cash-1.5e7,ti=tier(t);
if(!S.saved){S.saved=1;const b=load();S.pb=t>0&&(!b.length||t>b[0].t);save(t)}
return `<div class="card"><p class="sub">${S.deal>3?'Three deals complete':'Out of cash for another listing'}</p><h2 class="big">${NM[ti]}</h2><p style="margin:4px 0 10px">${MS[ti]}</p>${S.pb?'<div class="alert" style="color:var(--g2);border-color:var(--g)">New personal best</div>':''}<div class="row"><span>Total profit</span><b class="cu ${t>=0?'pos':'neg'}" data-n="${t}">${fmt(t)}</b></div><div class="row"><span>Final cash</span><b>${fmt(S.cash)}</b></div><div class="bar" style="margin:12px 0 4px"><i id="pb" data-w="${Math.max(0,Math.min(100,t/1e5))}"></i></div><small>${ti<4?fmt(Math.max(0,TH[ti]-t))+' more to reach '+NM[ti+1]:'You have reached the top rank'}</small><h3>Your best runs on this device</h3>${load().map(b=>`<div class="row"><span>${NM[b.ti]}</span><b>${fmt(b.t)}</b></div>`).join('')}<button class="go" onclick="shareCard()">Share my score card</button><button class="go alt" onclick="start(1)">Play again</button><a href="https://wa.me/923360839136?text=Hi%2C%20I%20played%20Flip%20House%20and%20would%20like%20to%20talk%20to%20Global%20Space." target="_blank"><button class="go alt">Talk to Global Space</button></a><a href="https://visionnext.co" target="_blank" rel="noopener"><button class="go alt">Visit our website</button></a><small id="shn" class="sub"></small><p class="sub" style="margin-top:10px">A simulation only. Tax rates are simplified; real rates depend on filer status and change often.</p></div>`}
start();
</script></body></html>
